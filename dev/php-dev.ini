; Development only.
;
; The wordpress image ships opcache with a revalidate window, and the theme is bind-mounted:
; edit a template, reload, and PHP serves the version it compiled a minute ago. That reads as
; "my change did nothing" and sends you looking for the bug in the wrong file - it cost one
; round of screenshots here before it was spotted.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
display_errors=On
error_reporting=E_ALL
